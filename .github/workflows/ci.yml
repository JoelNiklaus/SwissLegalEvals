name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: GIT_LFS_SKIP_SMUDGE=1 uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts/analyze_cap_compare.py
      - name: Test
        run: uv run pytest tests -q
